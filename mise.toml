#
# One toolchain file for every quality-gate tool.
# Developers and CI both read it: `mise install` gets the same versions everywhere.
# Python itself is managed by Poetry (see pyproject.toml), not by mise.

[tools]
ruff = "0.17.3"
task = "3.54.0"
hadolint = "2.15.1"
shellcheck = "0.11.0"
lychee = "0.24.2"
rumdl = "0.3.2"
osv-scanner = "2.7.0"
betterleaks = "1.9.0"
jactionlint = "2.4.0"
editorconfig-checker = "4.0.2"
"pypi:check-jsonschema" = "0.39.0"
"pypi:deptry" = "0.25.1"
"github:sbdchd/squawk" = "2.71.0"
"github:agent-sh/agnix" = "0.60.3"
