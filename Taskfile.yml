---
version: 3

tasks:

  compose-setup:
    cmds:
      - docker compose build

  compose-run:
    cmds:
      - docker compose up -d

  compose-test:
    cmds:
      - docker compose run --rm qbot task tests

  compose-bash:
    cmds:
      - docker compose run --rm qbot bash

  compose-psql:
    cmds:
      - docker compose run --rm qbot task psql

  compose-fmt:
    cmds:
      - docker compose run --rm qbot task fmt

  compose-lint:
    cmds:
      - docker compose run --rm qbot task lint

  run:
    deps: [syntax-check, type-check]
    cmds:
      - poetry run watchmedo auto-restart --patterns='*.py' --recursive -- poetry run python src/main.py run_polling

  tests:
    deps: [type-check]
    cmds:
      - poetry run pytest --ignore=src/tests/e2e --cov=src --cov-report html --cov-fail-under=96

  type-check:
    cmds:
      - poetry run mypy src

  syntax-check:
    cmds:
      - poetry run ruff check src --select=F --ignore=F401,F841

  test:
    deps: [syntax-check,type-check]
    cmds:
      - poetry run pytest {{.CLI_ARGS}}

  psql:
    cmds:
      - PGPASSWORD=admin psql -h postgres -U admin -d qbot

  fmt:
    cmds:
      - poetry run ruff check src --fix --fix-only

  lint:
    cmds:
      - poetry run ruff check src --output-format=concise
      - git ls-files | xargs mise exec -- editorconfig-checker
      - poetry run flake8 src
      - poetry run mypy src
      - poetry run sqlfluff lint migrations --dialect postgres

  check:
    desc: "Run every quality gate (CI runs this exact command)"
    deps: [lint]
    cmds:
      # Python dependencies
      - mise exec -- deptry src
      # Dockerfiles
      - mise exec -- hadolint Dockerfile Dockerfile.dev
      # Shell scripts
      - git ls-files '*.sh' | xargs -r mise exec -- shellcheck
      # Postgres migration safety
      - mise exec -- squawk 'migrations/*.sql'
      # GitHub Actions workflows
      - mise exec -- jactionlint .github/workflows/*.yml
      # Config files against JSON Schema
      - mise exec -- check-jsonschema --builtin-schema vendor.renovate renovate.json
      - mise exec -- check-jsonschema --builtin-schema github-workflows .github/workflows/changes-tested.yml .github/workflows/installing-dependencies.yml .github/workflows/lint.yml .github/workflows/pr-check.yml .github/workflows/release.yml .github/workflows/weekly-check.yml
      # Markdown
      - mise exec -- rumdl check README.md docs
      # Broken links (network-dependent)
      - mise exec -- lychee --no-progress README.md docs
      # Secrets scanning (working tree)
      - mise exec -- betterleaks detect --no-git
      # Vulnerability scanning in lockfile
      - mise exec -- osv-scanner scan --lockfile poetry.lock
      # Agent instructions
      - mise exec -- agnix validate AGENTS.md

  fix:
    desc: "Safe autofixes only (never deletes code unattended)"
    cmds:
      - poetry run ruff check src --fix --fix-only
      - mise exec -- rumdl fmt README.md docs


  clean:
    cmds:
      - git clean -f -d -x -e .env -e me.session -e .venv
      - docker rmi bot-qbot -f

  clear-cache:
    cmds:
      - redis-cli -h redis FLUSHALL

  migration:
    cmds:
      - poetry run yoyo new -m {{.CLI_ARGS}} --sql

  cspell-baseline:
    desc: "Generate cspell baseline"
    cmds:
      - git ls-files | grep -v -E 'src/tests/fixtures/' | xargs cspell --words-only | sort -uf > cspell_custom_words.txt
